name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run cross-platform unit tests
        run: python tests/test_cross_platform.py
      - name: Run internal-helper tests
        run: python tests/test_internals.py
      - name: Run PTY integration tests (POSIX only)
        if: runner.os != 'Windows'
        run: python tests/test_pty_integration.py
      - name: Verify package builds (sdist + wheel)
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify --version works
        run: python claude_auto.py --version
